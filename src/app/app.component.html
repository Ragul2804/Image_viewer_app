<div class="app-container">
  <!-- Left Side: Image Display Panel -->
  <div class="left-panel">
    <h2>Image Preview</h2>
    <div *ngIf="currentImages.length > 0; else noImage" class="image-viewer">
      <img [src]="currentImages[currentIndex].url" alt="Selected Image" class="preview-img" />
      <p class="image-counter">
        <strong>{{ currentImages[currentIndex].name }}</strong> <br>
        Image {{ currentIndex + 1 }} of {{ currentImages.length }}
      </p>
    </div>
    <ng-template #noImage>
      <p class="placeholder-text">Please Choose the Root Folder.</p>
    </ng-template>
  </div>

  <!-- Right Side: Control & Folder List Panel -->
  <div class="right-panel">
    <h2>Folder Navigation</h2>
    
    <!-- Folder Picker Button -->
    <div class="upload-box">
      <label for="folderInput" class="custom-file-btn">📁 Choose Root Folder</label>
      <input 
        id="folderInput" 
        type="file" 
        webkitdirectory 
        directory 
        multiple 
        (change)="onFolderSelected($event)" 
        style="display: none;"
      />
    </div>

    <!-- Folders and Images List Section -->
    <div class="folders-section">
      <h3>Folders & Images</h3>
      <ul class="folder-list" *ngIf="folderNames.length > 0; else emptyList">
        <li *ngFor="let folder of folderNames">
          <!-- Folder Item -->
          <div 
            class="folder-item" 
            [class.active]="folder === selectedFolder"
            (click)="selectFolder(folder)">
            📂 {{ folder }} ({{ folders[folder].length }})
          </div>

          <!-- Image Names list inside the selected folder -->
          <ul class="image-name-list" *ngIf="folder === selectedFolder">
            <li 
              *ngFor="let img of folders[folder]; let i = index"
              [class.active-img]="i === currentIndex"
              (click)="selectImage(i)">
              - {{ img.name }}
            </li>
          </ul>
        </li>
      </ul>
      <ng-template #emptyList>
        <p class="sub-placeholder">No folders found.</p>
      </ng-template>
    </div>

    <!-- Bottom Navigation Buttons (Previous & Next) -->
    <div class="nav-buttons" *ngIf="currentImages.length > 0">
      <button (click)="prevImage()" [disabled]="currentIndex === 0" class="btn">Previous</button>
      <button (click)="nextImage()" [disabled]="currentIndex === currentImages.length - 1" class="btn">Next</button>
    </div>
  </div>
</div>
